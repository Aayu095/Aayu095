<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380">
  <defs>
    <pattern id="dots2" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#1B222E"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="1198" height="378" rx="16" fill="#0B0E14" stroke="#232B38"/>
  <rect x="1" y="1" width="1198" height="378" rx="16" fill="url(#dots2)"/>

  <text x="56" y="96" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800" fill="#F5F7FA">EVERYONE BUILDS</text>
  <text x="56" y="136" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800" fill="#F5F7FA">FOR THE FRONT ROW.</text>
  <text x="56" y="190" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800" fill="#FF4D00">I BUILD FOR THIS ONE.</text>
  <text x="56" y="238" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#A7B0BE">The last row is where the need is real —</text>
  <text x="56" y="264" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#A7B0BE">and the competition is zero.</text>
  <text x="56" y="322" font-family="monospace" font-size="13" letter-spacing="2" fill="#8A94A6">EVERY PROJECT BELOW STARTS FROM ONE OF THESE SEATS</text>

  <!-- screen -->
  <text x="560" y="38" font-family="monospace" font-size="11" letter-spacing="3" fill="#8A94A6">THE SCREEN EVERYONE FACES</text>
  <rect x="560" y="48" width="560" height="10" rx="5" fill="#39445A"/>

